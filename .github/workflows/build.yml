name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build all modules
        run: bash ./gradlew build --no-daemon

      - name: Collect release JARs
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for module in fabric forge game-fabric game-forge; do
            mapfile -t jars < <(find "$module/build/libs" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort)
            if (( ${#jars[@]} != 1 )); then
              echo "Expected one release JAR in $module/build/libs, found ${#jars[@]}" >&2
              exit 1
            fi
            cp "${jars[0]}" release-assets/
          done

      - name: Save release JARs
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: release-assets/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release JARs
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: release-assets

      - name: Attach JARs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for jar in release-assets/*.jar; do
            name=$(basename "$jar")
            if grep -Fxq -- "$name" <<< "$existing"; then
              echo "Already attached: $name"
            else
              gh release upload "$RELEASE_TAG" "$jar"
            fi
          done
